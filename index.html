<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Excellence Challenge</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background:white;
    width:100%;
    max-width:850px;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
    animation:pop .5s ease;
}

@keyframes pop{
    from{
        opacity:0;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

h1{
    text-align:center;
    color:#1e40af;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:20px;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-weight:bold;
}

.progress{
    height:20px;
    background:#dbeafe;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22c55e,#10b981);
    transition:.4s;
}

.timer{
    text-align:center;
    margin:15px 0;
    font-size:1.2rem;
    font-weight:bold;
}

.question{
    font-size:1.25rem;
    margin:25px 0;
    color:#1f2937;
}

.answer{
    width:100%;
    border:none;
    border-radius:12px;
    padding:15px;
    margin:10px 0;
    font-size:1rem;
    cursor:pointer;
    background:#eff6ff;
    transition:.25s;
}

.answer:hover{
    background:#bfdbfe;
    transform:translateY(-2px);
}

.correct{
    background:#22c55e !important;
    color:white;
}

.wrong{
    background:#ef4444 !important;
    color:white;
}

#nextBtn{
    display:none;
    margin-top:20px;
    padding:12px 22px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:1rem;
}

.badge{
    font-size:40px;
    text-align:center;
    margin-top:20px;
    animation:bounce 1s infinite;
}

@keyframes bounce{
    50%{
        transform:translateY(-8px);
    }
}

#results{
    display:none;
    text-align:center;
}

#results h2{
    color:#2563eb;
}

.playAgain{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#16a34a;
    color:white;
    cursor:pointer;
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    border-radius:50%;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>📧 Email Excellence Challenge</h1>

<div class="subtitle">
Practice workplace communication and email etiquette.
</div>

<div class="info">
<div>Score: <span id="score">0</span></div>
<div>Question <span id="qNum">1</span>/10</div>
</div>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

<div class="timer">
⏳ Time Left: <span id="timer">15</span>s
</div>

<div id="game">

<div class="question" id="question"></div>

<div id="answers"></div>

<button id="nextBtn">Next Question</button>

<div class="badge">⭐</div>

</div>

<div id="results">

<h2>🎉 Challenge Complete!</h2>

<p id="finalScore"></p>

<p id="rating"></p>

<button class="playAgain" onclick="location.reload()">
Play Again
</button>

</div>

</div>

<script>

const questions = [

{
q:"Your manager asks for a project update and you need more time.",
a:[
"Can't finish it today.",
"I'm working on it.",
"Hello, I need one extra hour and can provide the completed update by 4 PM."
],
c:2
},

{
q:"You receive an email from a customer. What should you do first?",
a:[
"Ignore it.",
"Respond professionally and acknowledge the request.",
"Forward it to everyone."
],
c:1
},

{
q:"A professional email should include:",
a:[
"A clear subject line",
"Lots of emojis",
"Slang and abbreviations"
],
c:0
},

{
q:"You are running late to a meeting.",
a:[
"Say nothing.",
"Notify attendees as soon as possible.",
"Join whenever."
],
c:1
},

{
q:"Which greeting is most professional?",
a:[
"Hey dude",
"What's up?",
"Hello Team,"
],
c:2
},

{
q:"What is the best way to close an email?",
a:[
"Later",
"Best regards,",
"Byeeeee"
],
c:1
},

{
q:"How often should you check work messages?",
a:[
"Regularly according to workplace expectations",
"Never",
"Only on Fridays"
],
c:0
},

{
q:"A coworker needs help. What is a good response?",
a:[
"Offer assistance if available",
"Ignore them",
"Complain publicly"
],
c:0
},

{
q:"What should you do before sending an email?",
a:[
"Proofread it",
"Send without reviewing",
"Use ALL CAPS"
],
c:0
},

{
q:"What is a SMART workplace goal?",
a:[
"I want to do better someday.",
"Complete all assigned tasks this week by Friday at 5 PM.",
"I hope things improve."
],
c:1
}

];

let current = 0;
let score = 0;
let timeLeft = 15;
let timer;

const question = document.getElementById("question");
const answers = document.getElementById("answers");
const nextBtn = document.getElementById("nextBtn");

function updateTimer(){

const timerDisplay =
document.getElementById("timer");

timerDisplay.textContent = timeLeft;

if(timeLeft <= 5){
timerDisplay.style.color = "#ef4444";
}
else if(timeLeft <= 10){
timerDisplay.style.color = "#f59e0b";
}
else{
timerDisplay.style.color = "#22c55e";
}

}

function startTimer(){

clearInterval(timer);

timeLeft = 15;

updateTimer();

timer = setInterval(() => {

timeLeft--;

updateTimer();

if(timeLeft <= 0){

clearInterval(timer);

autoSubmit();

}

},1000);

}

function loadQuestion(){

const item = questions[current];

question.textContent = item.q;

document.getElementById("qNum").textContent =
current + 1;

document.getElementById("bar").style.width =
(current / questions.length * 100) + "%";

answers.innerHTML = "";

nextBtn.style.display = "none";

item.a.forEach((text,index)=>{

const button =
document.createElement("button");

button.className = "answer";

button.textContent = text;

button.onclick = () =>
selectAnswer(button,index);

answers.appendChild(button);

});

startTimer();

}

function selectAnswer(button,index){

clearInterval(timer);

const item = questions[current];

const buttons =
document.querySelectorAll(".answer");

buttons.forEach(btn=>btn.disabled=true);

if(index === item.c){

button.classList.add("correct");

score += 10;

document.getElementById("score").textContent =
score;

}
else{

button.classList.add("wrong");

buttons[item.c].classList.add("correct");

}

nextBtn.style.display = "inline-block";

}

function autoSubmit(){

const buttons =
document.querySelectorAll(".answer");

buttons.forEach(btn=>btn.disabled=true);

buttons[questions[current].c]
.classList.add("correct");

nextBtn.style.display = "inline-block";

}

nextBtn.addEventListener("click",()=>{

current++;

if(current < questions.length){
loadQuestion();
}
else{
endGame();
}

});

function endGame(){

clearInterval(timer);

document.getElementById("game").style.display =
"none";

document.getElementById("results").style.display =
"block";

document.getElementById("bar").style.width =
"100%";

document.getElementById("finalScore").textContent =
"Final Score: " + score + " / 100";

let rating = "";

if(score >= 90){
rating = "🏆 Workplace Communication Expert!";
}
else if(score >= 70){
rating = "🌟 Professional Communicator!";
}
else{
rating = "📘 Keep Practicing!";
}

document.getElementById("rating").textContent =
rating;

launchConfetti();

}

function launchConfetti(){

for(let i=0;i<80;i++){

const confetti =
document.createElement("div");

confetti.className = "confetti";

confetti.style.left =
Math.random()*100 + "vw";

confetti.style.background =
`hsl(${Math.random()*360},90%,60%)`;

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},3000);

}

}

loadQuestion();

</script>

</body>
</html>
